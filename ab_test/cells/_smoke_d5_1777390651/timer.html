<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background-color: transparent;
            color: #e6edf3;
            border: 2px solid rgba(230, 237, 243, 0.2);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .mode-btn.active {
            background-color: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }

        .timer-display {
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-size: 120px;
            font-weight: 300;
            margin: 40px 0;
            letter-spacing: 2px;
            line-height: 1;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background-color: #58a6ff;
            color: #0d1117;
            transition: all 0.2s ease;
            min-width: 100px;
        }

        .btn:hover {
            background-color: #79c0ff;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-reset {
            background-color: rgba(88, 166, 255, 0.2);
            color: #58a6ff;
            border: 1px solid #58a6ff;
        }

        .btn-reset:hover {
            background-color: rgba(88, 166, 255, 0.3);
        }

        .hint {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(230, 237, 243, 0.5);
        }

        @media (max-width: 600px) {
            .timer-display {
                font-size: 80px;
            }

            .mode-selector {
                flex-direction: column;
                gap: 8px;
            }

            .mode-btn {
                width: 100%;
            }

            .controls {
                gap: 12px;
            }

            .btn {
                flex: 1;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="focus">Focus (25:00)</button>
            <button class="mode-btn" data-mode="break">Break (5:00)</button>
        </div>

        <div class="timer-display" id="display">25:00</div>

        <div class="controls">
            <button class="btn" id="startBtn">Start</button>
            <button class="btn" id="pauseBtn" disabled>Pause</button>
            <button class="btn btn-reset" id="resetBtn">Reset</button>
        </div>

        <div class="hint">Press <strong>SPACE</strong> to toggle start/pause</div>
    </div>

    <script>
        const DURATIONS = {
            focus: 25 * 60,
            break: 5 * 60
        };

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        let state = {
            mode: 'focus',
            elapsed: 0,
            running: false,
            intervalId: null
        };

        const elements = {
            display: document.getElementById('display'),
            startBtn: document.getElementById('startBtn'),
            pauseBtn: document.getElementById('pauseBtn'),
            resetBtn: document.getElementById('resetBtn'),
            modeBtns: document.querySelectorAll('.mode-btn')
        };

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            const remaining = DURATIONS[state.mode] - state.elapsed;
            elements.display.textContent = formatTime(remaining);
        }

        function playAlert() {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.frequency.setValueAtTime(800, now);
            osc.frequency.setValueAtTime(600, now + 0.1);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

            osc.start(now);
            osc.stop(now + 0.5);

            setTimeout(() => {
                osc.frequency.setValueAtTime(800, audioContext.currentTime);
                osc.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + 0.5);
            }, 100);
        }

        function updateButtonStates() {
            elements.startBtn.disabled = state.running;
            elements.pauseBtn.disabled = !state.running;
        }

        function start() {
            if (state.running) return;
            state.running = true;
            updateButtonStates();

            state.intervalId = setInterval(() => {
                state.elapsed += 1;

                if (state.elapsed >= DURATIONS[state.mode]) {
                    pause();
                    playAlert();
                    state.elapsed = DURATIONS[state.mode];
                }

                updateDisplay();
            }, 1000);
        }

        function pause() {
            if (!state.running) return;
            state.running = false;
            clearInterval(state.intervalId);
            state.intervalId = null;
            updateButtonStates();
        }

        function reset() {
            pause();
            state.elapsed = 0;
            updateDisplay();
            updateButtonStates();
        }

        function setMode(mode) {
            if (state.running) return;
            state.mode = mode;
            state.elapsed = 0;
            updateDisplay();

            elements.modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        function toggleStartPause(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (state.running) {
                    pause();
                } else {
                    start();
                }
            }
        }

        elements.startBtn.addEventListener('click', start);
        elements.pauseBtn.addEventListener('click', pause);
        elements.resetBtn.addEventListener('click', reset);

        elements.modeBtns.forEach(btn => {
            btn.addEventListener('click', () => setMode(btn.dataset.mode));
        });

        document.addEventListener('keydown', toggleStartPause);

        updateDisplay();
        updateButtonStates();
    </script>
</body>
</html>
