[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beaconhill"
version = "0.1.0"
description = "Local-first coding agent harness for offline development"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
beaconhill = "beaconhill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beaconhill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
